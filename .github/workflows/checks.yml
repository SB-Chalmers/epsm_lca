name: Building renovation LCA checks
on: [push, pull_request, workflow_dispatch]
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Require access to private source dependencies
        env:
          DATA_KEY: ${{ secrets.EPSM_DATA_DEPLOY_KEY }}
          CORE_KEY: ${{ secrets.EPSM_CORE_DEPLOY_KEY }}
        run: |
          if [ -z "$DATA_KEY" ] || [ -z "$CORE_KEY" ]; then
            echo '::error::Configure read-only EPSM_DATA_DEPLOY_KEY and EPSM_CORE_DEPLOY_KEY. Required package checks have not run.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm_data
          ref: 2d66b181e4c3210db39c6594f80db4f26f2cc8d7
          ssh-key: ${{ secrets.EPSM_DATA_DEPLOY_KEY }}
          persist-credentials: false
          path: .ci/data
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm_core
          ref: 64909eb7e62ce2af4e515d4a443ecf82166c4803
          ssh-key: ${{ secrets.EPSM_CORE_DEPLOY_KEY }}
          persist-credentials: false
          path: .ci/core
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install actual package wheels
        run: |
          python -m pip install build
          python -m build --wheel --outdir .ci/wheels .ci/data
          python -m pip install .ci/wheels/epsm_data-*.whl
          python -m build --wheel --outdir .ci/wheels .ci/core
          python -m pip install .ci/wheels/epsm_core-*.whl
          python -m build --wheel --outdir .ci/wheels .
          python -m pip install '.ci/wheels/epsm_lca-0.2.0-py3-none-any.whl[dev,examples,docs]'
      - name: Lint and format
        run: |
          ruff check src tests examples scripts
          ruff format --check src tests examples scripts
      - name: Test installed wheel and offline docstring examples
        run: |
          python -c "import epsm_lca; assert 'site-packages' in epsm_lca.__file__"
          python -m pytest tests --cov=epsm_lca --cov-branch --cov-report=term-missing
          python -m pytest --doctest-modules --pyargs epsm_lca
      - name: Execute notebooks with fresh kernels
        run: python scripts/run_examples.py
      - name: Build the installed API documentation
        run: python -m sphinx -b html -W --keep-going docs build/docs
      - uses: actions/upload-artifact@v4
        with:
          name: lca-examples-and-api-python-${{ matrix.python }}
          path: |
            build/executed-examples
            build/docs
