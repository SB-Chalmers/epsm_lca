name: LCA release checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm_data
          ssh-key: ${{ secrets.EPSM_DATA_DEPLOY_KEY }}
          persist-credentials: false
          ref: ae102d33eda79fd429fb445ec99b32dabcab8024
          path: .ci/epsm_data
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and tools
        run: python -m pip install build -e .ci/epsm_data -e '.[dev]'
      - name: Test and lint
        run: |
          python -m pytest -q
          ruff check --select E4,E7,E9,F,I src
      - name: Build and check installed wheel
        run: |
          python -m build --wheel
          python -m pip install --no-deps --force-reinstall dist/epsm_lca-*.whl
          python -m pip check
          cd /tmp
          python -c 'from epsm_lca import AssessmentSettings, LCAResult, assess; print(AssessmentSettings, LCAResult, assess)'
