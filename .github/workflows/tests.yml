name: LCA release checks
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      development_dependencies:
        description: Check current dependency main branches on Python 3.13
        type: boolean
        default: false
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  combination:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm
          ssh-key: ${{ secrets.EPSM_REPO_DEPLOY_KEY }}
          persist-credentials: false
          ref: main
          path: .ci/platform
          sparse-checkout: |
            /compatibility.json
            /scripts/compatibility_matrix.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: matrix
        env:
          MATRIX_MODE: ${{ inputs.development_dependencies && 'main' || 'pinned' }}
        run: |
          python .ci/platform/scripts/compatibility_matrix.py \
            --manifest .ci/platform/compatibility.json --consumer epsm_lca \
            --packages epsm_data epsm_core \
            --manifest-revision "$(git -C .ci/platform rev-parse HEAD)" \
            --mode "$MATRIX_MODE" >> "$GITHUB_OUTPUT"
  package:
    name: package (${{ matrix.python }}, ${{ matrix.mode }})
    needs: combination
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.combination.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Require access to private source dependencies
        env:
          DATA_KEY: ${{ secrets.EPSM_DATA_DEPLOY_KEY }}
          CORE_KEY: ${{ secrets.EPSM_CORE_DEPLOY_KEY }}
        run: |
          if [ -z "$DATA_KEY" ] || [ -z "$CORE_KEY" ]; then
            echo '::error::Configure read-only EPSM_DATA_DEPLOY_KEY and EPSM_CORE_DEPLOY_KEY. Required package checks have not run.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm_data
          ref: ${{ matrix.epsm_data }}
          ssh-key: ${{ secrets.EPSM_DATA_DEPLOY_KEY }}
          persist-credentials: false
          path: .ci/data
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm_core
          ref: ${{ matrix.epsm_core }}
          ssh-key: ${{ secrets.EPSM_CORE_DEPLOY_KEY }}
          persist-credentials: false
          path: .ci/core
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install actual package wheels
        run: |
          python -m pip install build
          python -m build --wheel --outdir .ci/wheels .ci/data
          python -m pip install .ci/wheels/epsm_data-*.whl
          python -m build --wheel --outdir .ci/wheels .ci/core
          python -m pip install .ci/wheels/epsm_core-*.whl
          python -m build --wheel --outdir .ci/wheels .
          wheels=(.ci/wheels/epsm_lca-*.whl)
          test "${#wheels[@]}" -eq 1
          python -m pip install "${wheels[0]}[dev,examples,docs]"
          python -m pip check
      - name: Lint and format
        run: |
          ruff check src tests examples scripts
          ruff format --check src tests examples scripts
      - name: Test installed wheel and offline docstring examples
        run: |
          python -c "import epsm_lca; assert 'site-packages' in epsm_lca.__file__"
          python -m pytest tests --cov=epsm_lca --cov-branch --cov-report=term-missing
          python -m pytest --doctest-modules --pyargs epsm_lca
      - name: Execute notebooks with fresh kernels
        run: python scripts/run_examples.py
      - name: Build the installed API documentation
        run: python -m sphinx -b html -W --keep-going docs build/docs
      - uses: actions/upload-artifact@v4
        with:
          name: lca-examples-and-api-python-${{ matrix.python }}-${{ matrix.mode }}
          path: |
            build/executed-examples
            build/docs
