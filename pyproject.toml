[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epsm_lca"
version = "0.1.0"
description = "Explicit material-flow and operational GWP assessment for EPSM"
requires-python = ">=3.11"
dependencies = ["epsm_data>=0.4.0"]
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
