[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "epsm_lca"
dynamic = ["version"]
description = "Explicit material-flow and operational GWP assessment for EPSM"
requires-python = ">=3.11"
dependencies = ["epsm_data>=0.7.0", "epsm_core>=0.9.0"]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.11"]
integration = ["epsm[rc]>=0.2.0"]
plot = ["matplotlib>=3.8"]
examples = ["nbconvert>=7", "ipykernel>=6", "matplotlib>=3.8"]
docs = ["sphinx>=7", "numpydoc>=1.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.dynamic]
version = {attr = "epsm_lca._version.__version__"}

[project.urls]
Repository = "https://github.com/SB-Chalmers/epsm_lca"
Issues = "https://github.com/SB-Chalmers/epsm_lca/issues"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
